#@ load("/lib/validation.star", "is_dns_label", "is_dns_name", "is_otlp_enabled")

#@data/values-schema
---

#! =============================================
#! Ingress
#! =============================================

#! `ingress.domain` and `ca_cert_data` are shared across Kadras packages and set by the Kadras Engineering Platform.
#! Keep their names and shapes aligned in all packages.

#@schema/desc "Settings for exposing Knative Services via the Gateway API, through the Gateways of the Kadras Envoy Gateway package (https://github.com/kadras-io/package-for-envoy-gateway)."
ingress:
  #@schema/desc "The default domain name for all Knative Services, which are served as `<name>.<namespace>.<domain>`. Stored in the `config-domain` ConfigMap. Additional domains with label selectors can be configured via `config.domain`."
  #@schema/examples ("Custom domain", "example.com"), ("Local development with sslip.io", "127.0.0.1.sslip.io")
  #@schema/validation ("a valid DNS name", is_dns_name), min_len=1
  domain: ""
  #@schema/desc "Whether the external Gateway serves the Knative Services over HTTPS, and redirects HTTP requests to HTTPS. Knative Services then get `https` URLs. TLS is terminated on the Gateway, which needs a certificate for each namespace with Knative Services (`*.<namespace>.<domain>`)."
  https: false
  #@schema/desc "The Gateways routing the traffic to Knative Services. The defaults are the ones of the Kadras Envoy Gateway package. Their routes must be allowed from any namespace."
  gateways:
    #@schema/desc "The Gateway for the traffic from outside the cluster, exposed by the `envoy-<name>` Service in the same namespace."
    external:
      #@schema/desc "The name of the Gateway."
      #@schema/validation ("a valid DNS label", is_dns_label)
      name: external
      #@schema/desc "The namespace of the Gateway."
      #@schema/validation ("a valid DNS label", is_dns_label)
      namespace: envoy-gateway-system
    #@schema/desc "The Gateway for the cluster-local traffic, exposed by the `envoy-<name>` Service in the same namespace."
    internal:
      #@schema/desc "The name of the Gateway."
      #@schema/validation ("a valid DNS label", is_dns_label)
      name: internal
      #@schema/desc "The namespace of the Gateway."
      #@schema/validation ("a valid DNS label", is_dns_label)
      namespace: envoy-gateway-system

#@schema/desc "PEM-encoded certificate data to trust TLS connections with a custom CA."
ca_cert_data: ""

#! =============================================
#! High Availability
#! =============================================

#@schema/desc "Settings for the Knative Serving workloads. Set `replicas` greater than 1 to enable high availability."
workloads:
  activator:
    #@schema/desc "The minimum number of replicas, as controlled by a HorizontalPodAutoscaler."
    #@schema/validation min=1
    replicas: 1
  autoscaler:
    #@schema/desc "The number of replicas. Additional replicas are standby via leader election. With more than 1 replica, a PodDisruptionBudget is created."
    #@schema/validation min=1
    replicas: 1
  controller:
    #@schema/desc "The number of replicas. Additional replicas are standby via leader election. With more than 1 replica, a PodDisruptionBudget is created."
    #@schema/validation min=1
    replicas: 1
  ingress_controller:
    #@schema/desc "The number of replicas of the networking layer: `net-gateway-api-controller` and `net-gateway-api-webhook`. Additional controller replicas are standby via leader election. With more than 1 replica, PodDisruptionBudgets are created."
    #@schema/validation min=1
    replicas: 1
  webhook:
    #@schema/desc "The minimum number of replicas, as controlled by a HorizontalPodAutoscaler."
    #@schema/validation min=1
    replicas: 1

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs, metrics, and traces. Stored in the `config-observability` and `config-logging` ConfigMaps."
observability:
  logging:
    #@schema/desc "The log level for all Knative Serving components."
    #@schema/validation one_of=["debug", "info", "warn", "error"]
    level: info
    #@schema/desc "Whether the queue-proxy logs the requests received by Knative Services."
    request_logs: false
  #@schema/desc "Metrics for the Knative Serving control plane."
  metrics:
    #@schema/desc "Whether to produce metrics."
    enabled: true
    #@schema/desc "How the metrics are exported. With `prometheus`, the components expose them on port 9090, and their Pods are annotated for scraping. With `otlp`, they push them via OTLP to `endpoint`."
    #@schema/validation one_of=["prometheus", "otlp"]
    exporter: prometheus
    #@schema/desc "The OTLP transport protocol, with the `otlp` exporter."
    #@schema/validation one_of=["grpc", "http/protobuf"]
    protocol: grpc
    #@schema/desc "The OTLP endpoint metrics are exported to. Required with the `otlp` exporter. With `http/protobuf`, include the signal path."
    #@schema/examples ("OTLP/gRPC", "http://otel-collector.observability.svc:4317"), ("OTLP/HTTP", "http://otel-collector.observability.svc:4318/v1/metrics")
    #@schema/validation min_len=1, when=lambda _, ctx: is_otlp_enabled(ctx.parent)
    endpoint: ""
    #@schema/desc "The metrics reporting period."
    export_interval: 60s
  #@schema/desc "Metrics for the requests handled by the queue-proxy in the Pods of Knative Services."
  request_metrics:
    #@schema/desc "Whether to produce request metrics."
    enabled: false
    #@schema/desc "How the request metrics are exported. With `prometheus`, the queue-proxy exposes them on port 9091. With `otlp`, it pushes them via OTLP to `endpoint`."
    #@schema/validation one_of=["prometheus", "otlp"]
    exporter: prometheus
    #@schema/desc "The OTLP transport protocol, with the `otlp` exporter."
    #@schema/validation one_of=["grpc", "http/protobuf"]
    protocol: grpc
    #@schema/desc "The OTLP endpoint request metrics are exported to. Required with the `otlp` exporter. With `http/protobuf`, include the signal path."
    #@schema/examples ("OTLP/gRPC", "http://otel-collector.observability.svc:4317"), ("OTLP/HTTP", "http://otel-collector.observability.svc:4318/v1/metrics")
    #@schema/validation min_len=1, when=lambda _, ctx: is_otlp_enabled(ctx.parent)
    endpoint: ""
    #@schema/desc "The request metrics reporting period."
    export_interval: 60s
  #@schema/desc "Traces for the Knative Serving control plane and the requests handled by the queue-proxy."
  tracing:
    #@schema/desc "Whether to produce traces."
    enabled: false
    #@schema/desc "How the traces are exported. With `otlp`, they are pushed via OTLP to `endpoint`. With `console`, they are written to the standard output, for debugging."
    #@schema/validation one_of=["otlp", "console"]
    exporter: otlp
    #@schema/desc "The OTLP transport protocol, with the `otlp` exporter."
    #@schema/validation one_of=["grpc", "http/protobuf"]
    protocol: grpc
    #@schema/desc "The OTLP endpoint traces are exported to. Required with the `otlp` exporter. With `http/protobuf`, include the signal path."
    #@schema/examples ("OTLP/gRPC", "http://otel-collector.observability.svc:4317"), ("OTLP/HTTP", "http://otel-collector.observability.svc:4318/v1/traces")
    #@schema/validation min_len=1, when=lambda _, ctx: is_otlp_enabled(ctx.parent)
    endpoint: ""
    #@schema/desc "The fraction of requests to trace, from 0 (never) to 1 (always)."
    #@schema/validation min=0.0, max=1.0
    sampling_rate: 1.0

#! =============================================
#! Corporate Proxy and Policies
#! =============================================

#@schema/desc "Settings for the corporate proxy."
proxy:
  #@schema/desc "The HTTPS proxy to use for network traffic."
  https_proxy: ""
  #@schema/desc "The HTTP proxy to use for network traffic."
  http_proxy: ""
  #@schema/desc "A comma-separated list of hostnames, IP addresses, or IP ranges in CIDR format that should not use a proxy."
  no_proxy: ""

#@schema/desc "Settings for the Kyverno policies."
policies:
  #@schema/desc "Whether to include Kyverno policies verifying the signatures of the Knative Serving images. Kyverno 1.19 or later must be installed in the cluster."
  enabled: false

#! =============================================
#! Knative ConfigMaps
#! =============================================

#! Each entry maps to the `config-<name>` ConfigMap in the `knative-serving` namespace.
#! Keys are merged on top of the ones computed from the settings above, so they take precedence.
#! Non-string values are converted: maps and lists are encoded as YAML, other values as strings.

#@schema/desc "Data for the Knative Serving ConfigMaps, keyed by ConfigMap name without the `config-` prefix. Keys set here override the ones computed by the package. See https://knative.dev/docs/serving/configuration/config-defaults for the available options."
config:
  #@schema/desc "Data for the `config-autoscaler` ConfigMap."
  #@schema/type any=True
  autoscaler: {}
  #@schema/desc "Data for the `config-certmanager` ConfigMap."
  #@schema/type any=True
  certmanager: {}
  #@schema/desc "Data for the `config-defaults` ConfigMap."
  #@schema/type any=True
  defaults: {}
  #@schema/desc "Data for the `config-deployment` ConfigMap."
  #@schema/type any=True
  deployment:
    queue-sidecar-cpu-request: 25m
    queue-sidecar-cpu-limit: 1000m
    queue-sidecar-memory-request: 50Mi
    queue-sidecar-memory-limit: 200Mi
  #@schema/desc "Data for the `config-domain` ConfigMap."
  #@schema/type any=True
  domain: {}
  #@schema/desc "Data for the `config-features` ConfigMap."
  #@schema/type any=True
  features: {}
  #@schema/desc "Data for the `config-gateway` ConfigMap."
  #@schema/type any=True
  gateway: {}
  #@schema/desc "Data for the `config-gc` ConfigMap."
  #@schema/type any=True
  gc: {}
  #@schema/desc "Data for the `config-leader-election` ConfigMap."
  #@schema/type any=True
  leader-election: {}
  #@schema/desc "Data for the `config-logging` ConfigMap."
  #@schema/type any=True
  logging: {}
  #@schema/desc "Data for the `config-network` ConfigMap."
  #@schema/type any=True
  network: {}
  #@schema/desc "Data for the `config-observability` ConfigMap."
  #@schema/type any=True
  observability: {}
