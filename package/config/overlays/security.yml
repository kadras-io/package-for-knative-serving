#@ load("@ytt:overlay", "overlay")

#! The Knative Serving workloads comply with the "restricted" Pod Security Standard, enforced on the package namespace.
#! The queue-proxy sidecars run in the namespaces of the Knative Services, so they're not affected.
#! See: https://kubernetes.io/docs/concepts/security/pod-security-standards/

#@overlay/match by=overlay.subset({"kind": "Namespace", "metadata": {"name": "knative-serving"}})
---
metadata:
  #@overlay/match missing_ok=True
  labels:
    #@overlay/match missing_ok=True
    pod-security.kubernetes.io/enforce: restricted
    #@overlay/match missing_ok=True
    pod-security.kubernetes.io/audit: restricted
    #@overlay/match missing_ok=True
    pod-security.kubernetes.io/warn: restricted
