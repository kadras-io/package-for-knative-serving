apiVersion: vendir.k14s.io/v1alpha1
directories:
- contents:
  - githubRelease:
      disableAutoChecksumValidation: true
      slug: knative/serving
      tag: knative-v1.23.0
    includePaths:
    - serving-core.yaml
    path: serving
  - githubRelease:
      disableAutoChecksumValidation: true
      slug: knative-extensions/net-gateway-api
      tag: knative-v1.23.0
    includePaths:
    - net-gateway-api.yaml
    path: net-gateway-api
  path: config/upstream
kind: Config
minimumRequiredVersion: 0.32.0
