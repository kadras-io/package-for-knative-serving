---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: tests
status:
  latestReadyRevisionName: hello-00001
  url: https://hello.tests.127.0.0.1.sslip.io
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # The external Gateway redirects HTTP requests to HTTPS, and serves the Knative Service over HTTPS.
  - timeout: 30
    script: ../../setup/scripts/probe.sh envoy-external http://hello.tests.127.0.0.1.sslip.io 301
  - timeout: 30
    script: ../../setup/scripts/probe.sh envoy-external https://hello.tests.127.0.0.1.sslip.io 200
  # The cluster-local traffic goes through the internal Gateway.
  - timeout: 30
    script: |
      kubectl exec -n tests curl -- curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://hello.tests.svc.cluster.local | grep -q 200
  # A new controller Pod is admitted with the Kyverno policies in place, so its image signature and provenance are verified.
  - timeout: 150
    script: |
      kubectl rollout restart deployment/controller -n knative-serving
      kubectl rollout status deployment/controller -n knative-serving --timeout=120s
