apiVersion: v1
kind: ConfigMap
metadata:
  name: config-observability
  namespace: knative-serving
data:
  logging.enable-request-log: "true"
  metrics-protocol: grpc
  metrics-endpoint: http://otel-collector.observability:4317
  request-metrics-protocol: http/protobuf
  request-metrics-endpoint: http://otel-collector.observability:4318/v1/metrics
  tracing-protocol: grpc
  tracing-endpoint: http://otel-collector.observability:4317
  tracing-sampling-rate: "0.25"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-logging
  namespace: knative-serving
data:
  loglevel.controller: debug
  loglevel.queueproxy: debug
  loglevel.net-gateway-api-controller: debug
