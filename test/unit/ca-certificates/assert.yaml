apiVersion: v1
kind: Secret
metadata:
  name: knative-serving-ca-certificates
  namespace: knative-serving
stringData:
  (starts_with("ca.crt", '-----BEGIN CERTIFICATE-----')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: knative-serving
spec:
  template:
    spec:
      (containers[?name == 'controller'] | [0]):
        (env[?name == 'SSL_CERT_DIR'] | [0].value): /etc/ssl/certs-extra
        (volumeMounts[?name == 'ca-certificates'] | [0]):
          mountPath: /etc/ssl/certs-extra
          readOnly: true
      (volumes[?name == 'ca-certificates'] | [0]):
        secret:
          secretName: knative-serving-ca-certificates
