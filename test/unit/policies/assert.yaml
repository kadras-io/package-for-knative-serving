apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: knative-serving-verify-image
  namespace: knative-serving
spec:
  validationActions:
  - Deny
  matchImageReferences:
  - glob: gcr.io/knative-releases/knative.dev/serving/*
  - glob: gcr.io/knative-releases/knative.dev/net-gateway-api/*
  attestors:
  - name: knative
    cosign:
      keyless:
        identities:
        - subject: signer@knative-releases.iam.gserviceaccount.com
          issuer: https://accounts.google.com
---
apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: knative-serving-verify-provenance
  namespace: knative-serving
spec:
  validationActions:
  - Deny
  matchImageReferences:
  - glob: gcr.io/knative-releases/knative.dev/serving/*
  - glob: gcr.io/knative-releases/knative.dev/net-gateway-api/*
  attestors:
  - name: knative
    cosign:
      keyless:
        identities:
        - subject: signer@knative-releases.iam.gserviceaccount.com
          issuer: https://accounts.google.com
  attestations:
  - name: slsa
    intoto:
      type: https://slsa.dev/provenance/v0.2
  (length(validations)): 3
