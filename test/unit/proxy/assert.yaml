apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: knative-serving
spec:
  template:
    spec:
      (containers[?name == 'controller'] | [0]):
        (env[?name == 'HTTP_PROXY'] | [0].value): http://proxy.kadras.io:3128
        (env[?name == 'HTTPS_PROXY'] | [0].value): http://proxy.kadras.io:3128
        (env[?name == 'NO_PROXY'] | [0].value): .svc,.cluster.local
